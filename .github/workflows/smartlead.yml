name: SmartLead Lead Deletion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run cleanup or send a Resend connection test only
        type: choice
        options:
          - cleanup
          - email-test
        default: cleanup
      dry_run:
        description: Export and report without deleting leads (cleanup mode)
        type: boolean
        default: true
      sample_campaigns:
        description: Dry-run only; eligible campaigns to analyze (0 = all)
        type: number
        default: 0
      cleanup_scope:
        description: Delete all qualifying leads, or use the legacy target batch
        type: choice
        options:
          - all
          - target
        default: all
      resume_after_campaign:
        description: Continuation cursor; leave 0 for a new cleanup
        type: string
        default: '0'
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 UTC / 12:30 PM IST

permissions:
  contents: read
  actions: write # Queue a continuation when an all-leads run reaches its work budget.

concurrency:
  group: smartlead-cleanup
  cancel-in-progress: false

jobs:
  smartlead-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL || 'SmartLead Reports <reports@clientupdates.eagleinfoservice.com>' }}
      RECIPIENT_EMAILS: ${{ vars.RECIPIENT_EMAILS || 'arjav@eagleinfoservice.com' }}
      TARGET_LEADS: ${{ vars.TARGET_LEADS || '20000' }}
      DAYS_WITHOUT_ACTIVITY: ${{ vars.DAYS_WITHOUT_ACTIVITY || '30' }}
      EXCLUDE_CLIENT_IDS: ${{ vars.EXCLUDE_CLIENT_IDS || '1598' }}
      SMARTLEAD_REQUESTS_PER_MINUTE: ${{ vars.SMARTLEAD_REQUESTS_PER_MINUTE || '5400' }}
      DELETE_WORKERS: ${{ vars.DELETE_WORKERS || '10' }}
      ANALYSIS_WORKERS: ${{ vars.ANALYSIS_WORKERS || '16' }}
      RUN_MODE: ${{ inputs.mode || 'cleanup' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      SAMPLE_CAMPAIGNS: ${{ inputs.sample_campaigns || '0' }}
      CLEANUP_SCOPE: ${{ inputs.cleanup_scope || 'all' }}
      RESUME_AFTER_CAMPAIGN: ${{ inputs.resume_after_campaign || '0' }}
      DELETE_BATCH_SIZE: ${{ vars.DELETE_BATCH_SIZE || '10000' }}
      CLEANUP_BUDGET_MINUTES: ${{ vars.CLEANUP_BUDGET_MINUTES || '120' }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/drain-controller.test.cjs

      - name: Create output directory
        run: mkdir -p run-output

      - name: Test Resend connection only
        if: env.RUN_MODE == 'email-test'
        working-directory: run-output
        run: python ../smartlead_consolidated_git.py --mode email-test

      - name: Install the artifact client for all-leads cleanup
        if: env.RUN_MODE == 'cleanup' && env.CLEANUP_SCOPE == 'all'
        run: npm install --prefix "$RUNNER_TEMP/smartlead-artifact" --no-save --ignore-scripts @actions/artifact@6.3.1

      - name: Drain all eligible leads in backed-up batches
        if: env.RUN_MODE == 'cleanup' && env.CLEANUP_SCOPE == 'all'
        uses: actions/github-script@v8
        with:
          script: |
            const drain = require(`${process.env.GITHUB_WORKSPACE}/scripts/drain.cjs`);
            await drain({core, github, context});

      - name: Prepare cleanup and CSV backups
        if: env.RUN_MODE == 'cleanup' && env.CLEANUP_SCOPE == 'target'
        working-directory: run-output
        shell: bash
        run: |
          args=(--mode prepare --sample-campaigns "$SAMPLE_CAMPAIGNS")
          if [[ "$DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          python ../smartlead_consolidated_git.py "${args[@]}"

      # If this upload fails, execution stops before any deletion.
      - name: Save backup before deleting any leads
        if: env.RUN_MODE == 'cleanup' && env.CLEANUP_SCOPE == 'target'
        uses: actions/upload-artifact@v4
        with:
          name: smartlead-before-deletion-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/
          retention-days: 30
          if-no-files-found: error

      - name: Execute cleanup or dry run and send report
        if: env.RUN_MODE == 'cleanup' && env.CLEANUP_SCOPE == 'target'
        working-directory: run-output
        shell: bash
        run: |
          args=(--mode execute)
          if [[ "$DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          python ../smartlead_consolidated_git.py "${args[@]}"

      - name: Retain final logs and exports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartlead-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/
          retention-days: 30
          if-no-files-found: warn
